name: Test Release scripts with dry run

on:
  push:
  release:
    types: [created]
    
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17' 
        distribution: 'adopt'
        java-package: 'jdk' 

    - run: printf "JAVA_HOME = $JAVA_HOME \n"
    
    - name: Cache local Maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: gpg key generation - transient
      run: |
        printf "HOME: $HOME \n"
        export GNUPGHOME="$HOME/.gnupg"
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"
        
        # Configure GPG agent for loopback passphrase entry in headless CI environment
        echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
        echo "pinentry-mode loopback" >> "$GNUPGHOME/gpg.conf"
        gpgconf --reload gpg-agent
        
        cat >tempkey <<EOF
          %echo Generating a basic OpenPGP key
          Key-Type: DSA
          Key-Length: 1024
          Subkey-Type: ELG-E
          Subkey-Length: 1024
          Name-Real: J143 Bot
          Name-Comment: This is automation script
          Name-Email: j143+[bot]@protonmail.com
          Expire-Date: 0
          Passphrase: asdfghjkl
          %commit
          %echo done
        EOF
        gpg --batch --generate-key tempkey
        rm -f tempkey
        sudo cp -rp $HOME/.gnupg $HOME/gnupghome
      
    - name: Set the GPG key ID
      run: |
        export GNUPGHOME="$HOME/gnupghome"
        gpg --list-keys
        GPG_KEY_FINGERPRINT="$(gpg --list-keys | head -n 4 | tail -n 1 | sed 's/^ *//g')"
        GPG_KEY_ID="${GPG_KEY_FINGERPRINT: (-8)}"
    
    - name: Run invoke script
      run: |
        cd $GITHUB_WORKSPACE
        printf "$GITHUB_WORKSPACE --> github workspace\n"
        export GNUPGHOME="$HOME/gnupghome"
        
        # Enforce loopback config
        echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
        gpgconf --kill gpg-agent
        gpgconf --reload gpg-agent
        
        GPG_KEY_FINGERPRINT="$(gpg --list-keys | head -n 4 | tail -n 1 | sed 's/^ *//g')"
        GPG_KEY_ID="${GPG_KEY_FINGERPRINT: (-8)}"
        export GPG_KEY=$GPG_KEY_ID

        # Create GPG wrapper script
        cat << 'EOF' > $HOME/gpg-wrapper.sh
        #!/bin/bash
        gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$@"
        EOF
        chmod +x $HOME/gpg-wrapper.sh

        # Configure Git
        git config --global user.name "$GIT_NAME"
        git config --global user.email "$GIT_EMAIL"
        git config --global user.signingkey "$GPG_KEY"
        git config --global gpg.program "$HOME/gpg-wrapper.sh"
        
        # Run do-release.sh and trap failures to print tag.log
        if ! bash $GITHUB_WORKSPACE/dev/release/do-release.sh -n -g; then
          echo "==================== CONTENTS OF tag.log ===================="
          cat tag.log || cat $GITHUB_WORKSPACE/tag.log || echo "tag.log not found"
          echo "============================================================="
          exit 1
        fi
      env:
        DRY_RUN: '1'
        GIT_BRANCH: 'main'
        RELEASE_VERSION: '3.0.0'
        ASF_USERNAME: 'firstname'
        GIT_NAME: 'Firstname Lastname'
        GIT_EMAIL: 'j143+[bot]@protonmail.com'
        CORRECT_RELEASE_INFO: '1'
        ASF_PASSWORD: 'asdfghjkl'
        GPG_PASSPHRASE: 'asdfghjkl'